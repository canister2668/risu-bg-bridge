notes:
  - "Verified 2026-09-03: /app/package.json of image sha256:f4147742 reports pocketrisu@1.10.0, satisfying the AGENTS.md gate that pins the PocketRisu production target to v1.10.0."
  - "51 files (50 from /app/server/node plus /app/package.json) were extracted with docker create + docker cp + docker rm (the container was never started) and sha256-hashed into INVENTORY.json by scripts/fetch.mjs."
  - "The extraction was re-run from the image on 2026-09-03 and matched the earlier staging extraction on every file; no drift."
  - "server.cjs, model-jobs.cjs, bg-worker.cjs, bg-aux.cjs, hypa-bg.cjs and db.cjs match the six hashes individually verified during design-plan review before this lock was written."
  - "Verified in the locked source: model-jobs.cjs accepts client-supplied UUID job ids with 409-on-reuse but performs no request-fingerprint comparison; auth material is held memory-only; running jobs are marked failed with reason 'server restart' on boot; pending_sends are claimed atomically single-shot; retention rotation keeps unclaimed main jobs first."
  - "Round 2 (2026-09-03): the kit's patch series now adds server-side PUT idempotency with a canonical sha256 request fingerprint (adapters/pocket/series.yaml steps pocket-101..pocket-104) on top of this target. The target itself is unchanged and still lacks fingerprint idempotency natively; every hash below still describes the unpatched artifact."
  - "Round-2 principal model (verified in the locked source): 1.10.0 authenticates with a server-issued HS256 JWT whose payload is only {iat, exp} plus a single instance password — there is no per-user subject. The only existing non-secret host identity is instanceId, already persisted at save/__instance_id and already used by update-check analytics (id) and compute-offload (scopeId). The bridge therefore scopes every row to the single principal pocket-host:<instanceId> and fails closed (404) on any row not under it; stock POST rows carry NULL principal and stay invisible to the bridge."
  - "Round-2 restart-recovery decision (fail-closed, reported false): reconstructing an approved request after a restart would require persisting the target URL, headers, or body — and the headers carry provider credentials that this target deliberately keeps memory-only per its own schema comment. The journal holds response bytes only, so no secret-free reconstruction exists. Boot keeps markRunningJobsFailed('server restart'); a re-PUT of the same fingerprint replays the failed row (200, isNew false) instead of resuming. restartRecovery stays false everywhere."
  - "Round-2 finalization seam (durableFinalization stays false): chat storage is not reachable from the model-jobs relay, so the series adds a proof SEAM, not a materialization ledger — the server verifies the journal sha256 resultHash plus the unexpired lease and exact fencing token, and durably records the client-asserted generationId/messageId/chatRevision/persistedAt. Materialization itself remains client-side."
gaps:
  - "Upstream commit SHA and tag are unknown: no PocketRisu git checkout exists on this host. upstream.version comes from the image's own package.json, not from upstream VCS, so '1.10.0' is verified as the image's identity but not traced to an upstream commit."
  - "The pinned image is a local build with no registry repoDigest, so its lineage back to upstream sources cannot be independently verified. This lock therefore pins THIS image as the exact patch target — patches apply to this artifact, not to upstream code."
  - "Lock tooling does not re-check the docker daemon; it verifies the extracted snapshot hashes. Confirming the source image still exists locally (docker inspect risuai:nodeonly-client-aux-handoff-20260829) is a manual step."
  - "The missing request-fingerprint idempotency in model-jobs.cjs is a gap in the TARGET itself; the kit's patch series now supplies it on top of the pinned artifact, but this lock describes the unpatched target, so the gap is recorded rather than papered over."
  - "The locked snapshot is verified textually only: better-sqlite3 and the full server runtime are not kit dependencies, so the round-2 bridge behavior is proven by series application, node --check, and pinned-content tests, not by executing the patched server against a live database."
  - "Principal scoping is single-host-instance by construction: 1.10.0 has no per-user identity to scope by, so bridge rows cannot be attributed to individual users — only to the authenticated instance that created them."
